<!DOCTYPE html>
<html>

<head>

<title>AI Health-Aware Task Manager</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="/static/style.css">

</head>

<body class="bg-dark text-light">

<div class="d-flex">

<!-- SIDEBAR -->

<div class="sidebar">

<h3 class="logo">TaskMind</h3>

<ul>

<li><i class="fa fa-home"></i> Dashboard</li>
<li><i class="fa fa-brain"></i> Smart Tasks</li>
<li><i class="fa fa-chart-line"></i> Analytics</li>
<li><i class="fa fa-lightbulb"></i> Insights</li>

</ul>

</div>


<!-- MAIN CONTENT -->

<div class="main-content container-fluid">

<div class="topbar d-flex justify-content-between align-items-center mb-4">

<h4>AI Productivity Dashboard</h4>

<div class="topbar-icons">

<i class="fa fa-bell"></i>
<i class="fa fa-user-circle"></i>

</div>

</div>


<h2>How are you feeling today?</h2>
{% if not user %}

<a href="/login" class="btn btn-danger mb-4">
<i class="fa fa-google"></i>
Login with Google
</a>

{% else %}

<a href="/logout" class="btn btn-warning mb-4">
Logout
</a>

{% endif %}


<p>Describe your mood and the AI will generate tasks suited to your energy level.</p>


<form action="/tasks" method="POST">

<div class="mb-3">

<input
type="text"
name="mood"
class="form-control"
placeholder="Example: I feel tired and unmotivated today"
required>

</div>

<button type="submit" class="btn btn-primary">

Generate Smart Tasks

</button>

</form>

</div>

</div>

</body>

</html>
